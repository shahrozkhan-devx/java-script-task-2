<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172238">
  <title>JavaScript Practice Lab</title>
  <style>
    :root{--ink:#172238;--paper:#f2efe7;--lime:#d8e68b;--line:#dcd6c8}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 92% 8%,#dde5bb 0,transparent 29%),var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    main{width:min(1120px,calc(100% - 36px));margin:auto;padding:clamp(28px,6vw,64px) 0}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}.eyebrow{color:#66732f;font:700 10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{margin:10px 0 0;font-size:clamp(44px,7vw,74px);line-height:1;letter-spacing:-.055em}.top p:last-child{max-width:230px;color:#74776d;font:12px/1.6 Arial,sans-serif;text-align:right}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}.task{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;gap:14px;min-height:92px;padding:16px 18px;border:1px solid var(--line);border-radius:5px;background:#fffefa;text-align:left;cursor:pointer;transition:.22s}.task:hover,.task:focus-visible{transform:translateX(5px);border-color:#afb977;outline:none}.number{display:grid;width:52px;height:52px;place-items:center;border-radius:50%;background:var(--lime);font:700 12px Arial,sans-serif}.task strong{display:block;margin-bottom:5px;font-size:18px}.task small{color:#7b7f73;font:11px Arial,sans-serif}.arrow{color:#69714e;font:24px Arial,sans-serif;text-align:right}.footer{margin-top:22px;color:#858779;font:10px Arial,sans-serif}
    @media(max-width:650px){main{width:calc(100% - 24px)}.top{align-items:start;flex-direction:column}.top p:last-child{text-align:left}.grid{grid-template-columns:1fr}.task{grid-template-columns:46px 1fr 28px}}
  </style>
</head>
<body>
  <main><header class="top"><div><p class="eyebrow">Shahroz Khan · JavaScript fundamentals</p><h1>Practice lab.</h1></div><p>Ten browser tasks covering conditions, calculations and basic validation.</p></header>
  <section class="grid" aria-label="JavaScript practice tasks">
    <button class="task" onclick="ageGroup()"><span class="number">01</span><span><strong>Age group identifier</strong><small>Conditional classification</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="evenOdd()"><span class="number">02</span><span><strong>Even or odd</strong><small>Number remainder</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="posNegZero()"><span class="number">03</span><span><strong>Positive, negative or zero</strong><small>Number comparison</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="vowelCheck()"><span class="number">04</span><span><strong>Vowel or consonant</strong><small>String validation</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="calculator()"><span class="number">05</span><span><strong>Simple calculator</strong><small>Basic arithmetic</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="leapYear()"><span class="number">06</span><span><strong>Leap year checker</strong><small>Calendar logic</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="temperature()"><span class="number">07</span><span><strong>Temperature checker</strong><small>Range logic</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="grade()"><span class="number">08</span><span><strong>Grade calculator</strong><small>Score thresholds</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="largest()"><span class="number">09</span><span><strong>Largest of three</strong><small>Multiple comparisons</small></span><span class="arrow">↗</span></button>
    <button class="task" onclick="login()"><span class="number">10</span><span><strong>Login system</strong><small>Credential validation</small></span><span class="arrow">↗</span></button>
  </section><p class="footer">JavaScript Practice Tasks / Browser prompts</p></main>
  <script src="app.js"></script>
</body>
</html>
